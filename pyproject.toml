[project]
name = "markdown-review"
version = "0.1.0"
description = "Block-based markdown review tool with agent + user annotations"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.32",
    "markdown-it-py>=3.0",
    "mdit-py-plugins>=0.4",
    "pydantic>=2.9",
]

[project.scripts]
markdown-review = "markdown_review.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["markdown_review"]

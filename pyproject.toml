[project]
name = "markdown-review"
version = "0.1.0"
description = "Block-based markdown review tool with agent + user annotations"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
authors = [
    { name = "markdown-review contributors" },
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Framework :: FastAPI",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Topic :: Text Processing :: Markup :: Markdown",
]
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.32",
    "markdown-it-py>=3.0",
    "mdit-py-plugins>=0.4",
    "pydantic>=2.9",
]

[project.scripts]
markdown-review = "markdown_review.cli:main"

[project.urls]
Homepage = "https://github.com/onesvat/markdown-review"
Repository = "https://github.com/onesvat/markdown-review"
Issues = "https://github.com/onesvat/markdown-review/issues"

[dependency-groups]
dev = [
    "pytest>=8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["markdown_review"]

[tool.hatch.build.targets.wheel.force-include]
"review_app" = "review_app"

[tool.pytest.ini_options]
testpaths = ["tests"]
